<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いたずラッシュ</title>
<meta name="description" content="子どものころにやりたかったいたずらを、数秒ずつやり放題。最後に大人の現実（後始末の時間・損害額・怒られ度）を突きつけられるストレス解消ネタサイト。">
<meta property="og:type" content="website">
<meta property="og:title" content="いたずラッシュ">
<meta property="og:description" content="子どものころにやりたかったいたずらを、数秒ずつやり放題。最後に大人の現実が待っています。">
<meta property="og:url" content="https://sakuichi.github.io/itazu-rush/">
<link rel="canonical" href="https://sakuichi.github.io/itazu-rush/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: 縦長1画面のゲーム台。キャンバス全面（HUDと結果もキャンバスに描く＝録画に写る）、操作用のボタンだけDOM */
:root{
  --ink:#231b2e; --paper:#fffdf5; --pop:#ffd23f; --pop-deep:#ffb81f;
  --hot:#ff5a4e; --mint:#2fb5a3; --mute:#6b6178;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:560px;margin-inline:auto;background:var(--pop);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:absolute;top:10px;right:16px;pointer-events:none}
#pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}

.panel{position:absolute;inset:0;display:flex;padding:16px 20px 24px 16px;overflow:auto}
#pause,#shop{background:rgba(35,27,46,.62)}
.card{margin:auto;width:100%;max-width:400px;background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.08em;background:var(--ink);color:var(--pop);padding:3px 9px;border-radius:3px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,48px);line-height:1.05;margin:0;text-wrap:balance;transform:rotate(-2deg);transform-origin:left center}
h1 span{color:var(--hot)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.25}
p{margin:0;line-height:1.7;font-size:15px}
.lead{font-weight:700}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:13px;font-weight:700;line-height:1.5;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:#fff}
.chips li.secret{background:var(--ink);color:var(--pop)}
.btns{display:flex;flex-direction:column;gap:10px}
button.big{font-family:var(--display);font-size:20px;line-height:1.3;padding:12px 16px;border:4px solid var(--ink);border-radius:6px;background:var(--hot);color:var(--paper);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
button.big.sub{background:var(--paper);color:var(--ink);font-size:16px;padding:10px 16px}
button.big small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
button.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--hot)}
.small{font-size:12px;color:var(--mute);line-height:1.6}
.small:empty{display:none}

/* 結果：中身はキャンバスに描き、下にボタンの帯だけ出す */
.panel.bottom{align-items:flex-end;pointer-events:none;padding:12px 16px 14px}
.resbar{pointer-events:auto;width:100%;max-width:420px;margin:0 auto;background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.resbar button.big{font-size:18px;padding:10px 12px}
.minirow{display:flex;gap:6px}
button.mini{flex:1 1 0;min-width:0;font-family:var(--body);font-weight:900;font-size:13px;line-height:1.3;padding:8px 2px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
button.mini:active{transform:translate(2px,2px)}
.shoplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.shoplist a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.shoplist small{color:var(--mute);font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="ゲーム画面"></canvas>

  <div id="hud" hidden>
    <button id="pauseBtn" type="button" aria-label="中断する">II</button>
  </div>

  <section class="panel" id="title">
    <div class="card">
      <div class="tag">試作版</div>
      <h1>いたず<br><span>ラッシュ</span></h1>
      <p class="lead">子どものころ、やりたかったやつ。<br>後片付けのことは考えなくていい。</p>
      <ul class="chips" id="chips" aria-label="出てくるいたずら"></ul>
      <div class="btns">
        <button class="big" id="startBtn" type="button">はじめる<small id="startSub"></small></button>
        <button class="big sub" id="endlessBtn" type="button">無限モード<small>「やめて結果を見る」まで続く</small></button>
      </div>
      <div class="opts">
        <label class="opt" for="soundChk"><input type="checkbox" id="soundChk" checked>音を出す</label>
        <label class="opt" for="recChk" id="recOpt" hidden><input type="checkbox" id="recChk">録画する</label>
      </div>
      <p class="small" id="recNote" hidden>録画すると、プレイから結果までを音つきの動画で保存できます（音を出さない設定でも、動画には音が入ります）。</p>
      <p class="small">周回ごとに速くなります。失敗はありません。右上の II でいつでも中断できます。</p>
      <p class="small">※いたずらをすすめるものではありません。画面の中だけで楽しんでください。</p>
    </div>
  </section>

  <section class="panel" id="pause" hidden>
    <div class="card">
      <h2>中断中</h2>
      <div class="btns">
        <button class="big" id="resumeBtn" type="button">つづける</button>
        <button class="big sub" id="quitBtn" type="button">ここでやめて結果を見る</button>
        <button class="big sub" id="homeBtn" type="button">タイトルにもどる</button>
      </div>
      <label class="opt" for="soundChk2"><input type="checkbox" id="soundChk2" checked>音を出す</label>
    </div>
  </section>

  <section class="panel bottom" id="result" hidden>
    <div class="resbar" id="resbar">
      <button class="big" id="againBtn" type="button">もう一回いたずらする</button>
      <div class="minirow">
        <button class="mini" id="saveVid" type="button" hidden>動画を保存</button>
        <button class="mini" id="xpost" type="button">Xでポスト</button>
        <button class="mini" id="shopBtn" type="button">買い直す</button>
        <button class="mini" id="home2Btn" type="button">タイトル</button>
      </div>
      <p class="small" id="recHint" role="status"></p>
    </div>
  </section>

  <section class="panel" id="shop" hidden>
    <div class="card">
      <div class="tag">PR</div>
      <h2>いたずらした分を<br>買い直す</h2>
      <ul class="shoplist" id="shopList"></ul>
      <p class="small">Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。</p>
      <button class="big sub" id="shopClose" type="button">とじる</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const INK = '#231b2e', PAPER = '#fffdf5', POP = '#ffd23f', POP2 = '#ffb81f', HOT = '#ff5a4e';
const DISPLAY = '"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
const BODY = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const sr = s => { const x = Math.sin(s * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function bigText(str, x, y, size, fill, stroke, maxW) {
  ctx.save();
  ctx.font = `${size}px ${DISPLAY}`;
  if (maxW) {
    const m = ctx.measureText(str).width;
    if (m > maxW) { size = size * maxW / m; ctx.font = `${size}px ${DISPLAY}`; }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
  ctx.restore();
}
function finger(x, y, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI * 2);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

/* ---------- 音 ---------- */
/* 経路: 効果音・BGM → bus →（スピーカー用ゲイン → スピーカー）と（録画用の出力）。
   音を出さない設定はスピーカー用ゲインを0にするだけで、音そのものは作り続ける（録画には入る） */
let AC = null, noiseBuf = null, bus = null, spk = null, bgmBus = null, recDest = null, soundOn = true;
try { soundOn = localStorage.getItem('itazurush-sound') !== '0'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume(); return; } // iOSは共有シートなどの後に "interrupted" になる
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.5), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    bus = AC.createGain(); bus.gain.value = 0.8;
    spk = AC.createGain(); spk.gain.value = soundOn ? 1 : 0;
    bus.connect(spk); spk.connect(AC.destination);
    bgmBus = AC.createGain(); bgmBus.gain.value = 0.55; bgmBus.connect(bus);
    try {
      recDest = AC.createMediaStreamDestination(); bus.connect(recDest);
      // 録画用の音声を途切れさせないための、聞こえない音（スピーカーには流さない）。無音区間で音声データが抜けると動画の音がズレる
      const ka = AC.createOscillator(), kg = AC.createGain();
      ka.frequency.value = 20; kg.gain.value = 0.0005; ka.connect(kg); kg.connect(recDest); ka.start();
    } catch (e) { recDest = null; }
  } catch (e) { AC = null; }
}
function noise(dur, freq, q, vol, type, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, vol, type, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  tissue() { noise(0.13, rnd(2600, 3800), 0.7, 0.28); },
  tick() { noise(0.035, rnd(1500, 2100), 3, 0.16); },
  shoji() { noise(0.1, rnd(380, 620), 0.8, 0.5, 'lowpass'); tone(150, 60, 0.09, 0.2, 'sine'); },
  slide() { noise(0.25, 900, 0.6, 0.25); tone(90, 70, 0.2, 0.15, 'triangle'); },
  refill() { tone(660, 990, 0.12, 0.1); },
  prompt() { tone(660, 660, 0.08, 0.1); tone(880, 880, 0.12, 0.1, 'square', 0.09); },
  flash() { tone(523, 523, 0.09, 0.1); tone(784, 784, 0.16, 0.1, 'square', 0.09); },
  final() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 0.1, 'square', i * 0.11)); },
  rare() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, f, 0.1, 0.08, 'square', i * 0.06)); noise(0.4, 6000, 1, 0.08, 'highpass', 0.3); },
  row() { tone(1200, 1200, 0.04, 0.05, 'square'); },
  stamp() { tone(170, 55, 0.22, 0.4, 'sine'); noise(0.14, 500, 0.7, 0.45, 'lowpass'); }
};

/* ---------- BGM（その場で合成する、ステージごとの2小節ループ） ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// 音符列: 16分音符1つにつき1語。数字=MIDIノート番号、'-'=前の音をのばす、'.'=休み
function seq(str) {
  const tk = str.trim().split(/\s+/), out = new Array(tk.length).fill(null);
  let last = -1;
  tk.forEach((s, i) => {
    if (s === '-') { if (last >= 0) out[last][1]++; }
    else if (s === '.') last = -1;
    else { out[i] = [+s, 1]; last = i; }
  });
  return out;
}
function song(bpm, tracks, drums, pad) {
  const t = tracks.map(([v, vol, str]) => ({ v, vol, seq: seq(str) }));
  return { bpm, tracks: t, drums, pad, len: t[0].seq.length };
}
function voice(kind, m, t, dur, vol, out) {
  const f = mtof(m);
  const osc = (type, freq, mul, d, a) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * mul, t + (a || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.03);
    return o;
  };
  switch (kind) {
    case 'pluck': osc('triangle', f, 1, Math.max(0.28, dur)); osc('sine', f * 2, 0.45, 0.12); break; // 琴っぽい
    case 'bell': osc('sine', f, 1, 0.7, 0.003); osc('sine', f * 2.76, 0.35, 0.3, 0.003); break;
    case 'ep': osc('sine', f, 1, Math.max(0.45, dur * 1.1), 0.012); osc('triangle', f * 2, 0.16, 0.25, 0.012); break;
    case 'bub': { const o = osc('sine', f, 1, Math.min(0.16, dur)); o.frequency.setValueAtTime(f * 0.6, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05); break; }
    case 'wob': { const o = osc('sine', f, 1, dur * 0.95); o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.07); osc('triangle', f, 0.4, dur * 0.9); break; }
    default: osc(kind, f, 1, dur * 0.92);
  }
}
function drum(c, t, out) {
  const n = (dur, freq, q, vol, type) => {
    const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; fl.type = type || 'bandpass'; fl.frequency.value = freq; fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
  };
  const k = (f0, f1, dur, vol) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  };
  switch (c) {
    case 'k': k(150, 45, 0.12, 0.5); break;                              // キック
    case 's': n(0.12, 1800, 0.8, 0.22); k(220, 160, 0.06, 0.12); break; // スネア
    case 'h': n(0.035, 8000, 1, 0.08, 'highpass'); break;               // ハイハット
    case 'o': n(0.16, 7000, 1, 0.07, 'highpass'); break;                // オープンハイハット
    case 'c': n(0.08, 1400, 1.2, 0.25); break;                          // クラップ
    case 't': k(180, 70, 0.22, 0.5); n(0.08, 500, 1, 0.12, 'lowpass'); break; // 太鼓
    case 'r': n(0.03, 2500, 4, 0.25); break;                            // リムショット
    case 'j': n(0.05, 9500, 2, 0.06, 'highpass'); n(0.04, 7000, 3, 0.04); break; // 鈴
  }
}
const music = {
  song: null, out: null, step: 0, next: 0, dur: 0.1, timer: 0,
  start(sg, rate) {
    this.stop();
    if (!AC || !sg) return;
    this.song = sg; this.dur = 60 / (sg.bpm * rate) / 4; this.step = 0; this.next = AC.currentTime + 0.05;
    this.out = AC.createGain(); this.out.gain.value = 1; this.out.connect(bgmBus);
    this.timer = setInterval(() => this.pump(), 25); this.pump();
  },
  stop() {
    clearInterval(this.timer); this.timer = 0; this.song = null;
    if (this.out && AC) {
      const o = this.out; o.gain.setTargetAtTime(0, AC.currentTime, 0.03);
      setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 500);
    }
    this.out = null;
  },
  pump() {
    const s = this.song; if (!s || !AC) return;
    if (this.next < AC.currentTime - 0.2) this.next = AC.currentTime + 0.02; // タブの裏などで遅れたら追いつかせない
    while (this.next < AC.currentTime + 0.12) {
      const i = this.step % s.len, t = this.next, d = this.dur;
      for (const tr of s.tracks) { const ev = tr.seq[i]; if (ev) voice(tr.v, ev[0], t, ev[1] * d, tr.vol, this.out); }
      if (s.pad && i % s.pad.every === 0) {
        for (const m of s.pad.chords[(i / s.pad.every) % s.pad.chords.length]) voice(s.pad.v, m, t, s.pad.every * d, s.pad.vol, this.out);
      }
      for (const dl of s.drums) { const c = dl[i % dl.length]; if (c !== '.') drum(c, t, this.out); }
      this.step++; this.next += d;
    }
  }
};

/* ---------- ステージ1: ティッシュ ---------- */
const tissue = {
  key: 'tissue', name: 'ティッシュ', prompt: '出せ！', hint: '左右に交互にスワイプ', bg: '#ff9e8a',
  bgm: song(152, [ // 軽快
    ['square', 0.05, '72 . 76 . 79 . 76 . 72 . 74 . 76 - - . 77 . 76 . 74 . 72 . 74 . 71 . 72 - - .'],
    ['triangle', 0.16, '48 . . . 55 . . . 48 . . . 55 . . . 53 . . . 55 . . . 48 . . . 43 . 47 .']
  ], ['k.h.s.h.k.h.s.hhk.h.s.h.k.h.s.hh']),

/* ---------- ステージ4〜で使う共通部品 ---------- */
const SC = () => Math.min(W / 390, H / 700, 1.3); // 390×700 を基準にした拡大率
const fmtLen = cm => cm < 100 ? Math.floor(cm) + 'cm' : (cm / 100).toFixed(1) + 'm';
Object.assign(sfx, {
  squish() { noise(0.09, rnd(260, 420), 1.2, 0.4, 'lowpass'); tone(rnd(150, 200), 90, 0.07, 0.1, 'sine'); },
  pump() { tone(330, 170, 0.07, 0.12, 'triangle'); noise(0.1, 1500, 1, 0.16, 'bandpass', 0.03); },
  crunch() { noise(0.08, rnd(800, 1300), 0.6, 0.35, 'lowpass'); noise(0.05, rnd(2500, 3500), 1, 0.08); },
  flip() { noise(0.25, 700, 0.7, 0.3); tone(200, 520, 0.18, 0.1, 'square'); },
  clatter() { tone(rnd(500, 1100), rnd(300, 700), 0.05, 0.05, 'square'); noise(0.04, rnd(2000, 4000), 3, 0.08); },
  charge(k) { tone(220 + k * 500, 240 + k * 520, 0.06, 0.05, 'square'); },
  jump() { tone(300, 750, 0.18, 0.1, 'square'); },
  splash(p) { noise(0.5, 900, 0.5, 0.25 + 0.35 * p, 'lowpass'); noise(0.35, 2500, 0.8, 0.22); tone(160, 60, 0.2, 0.2, 'sine'); },
  water(v) { noise(0.09, rnd(1500, 2600), 0.5, 0.04 + 0.12 * v); },
  handle() { tone(rnd(1300, 1600), 900, 0.03, 0.05, 'square'); },
  full() { tone(523, 1047, 0.25, 0.1, 'square'); noise(0.5, 2000, 0.5, 0.2); },
  ding(f) { const h = 660 * Math.pow(2, (f % 12) / 12); tone(h, h, 0.3, 0.07, 'sine'); tone(h * 2, h * 2, 0.15, 0.025, 'sine'); },
  buzz(n) { tone(110 + Math.min(n, 60) * 2, 100, 0.13, 0.13, 'sawtooth'); tone(55, 55, 0.13, 0.12, 'square'); }
});
function tapHint(x, y, t, rate) {
  const p = (t * (rate || 1.6)) % 1;
  ctx.save(); ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.arc(x, y, 17 + p * 26, 0, Math.PI * 2); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();

/* ---------- ステージ4: 歯みがき粉 ---------- */
const TUBE_CM = 350; // 1本（120g）をしぼり切ると、およそこの長さ
const paste = {
  key: 'paste', name: '歯みがき粉', prompt: 'しぼれ！', hint: '長押しで ぎゅーっ', bg: '#bfe6ef',

    ['square', 0.04, '67 . . 70 . 72 . . 67 . . 65 . 67 . . 70 . . 72 . 74 . . 77 . 74 . 72 . 70 .'],
    ['wob', 0.2, '43 . 43 . . 46 . . 43 . 41 . . 38 . . 43 . 43 . . 46 . . 48 . 46 . 43 . 41 .']
  ], ['k..s.k..k.s..s..k.hs.kh.k.s.hs.h']),
  shop: [['歯みがき粉', '歯磨き粉']],
  bill(t) { const cm = t.paste || 0; return { v: fmtLen(cm), n: 'チューブ ' + (cm / TUBE_CM).toFixed(1) + '本分・洗面台をふく', sec: cm / 100 * 120, yen: cm / TUBE_CM * 250 }; },
  init() { this.cm = 0; this.hold = {}; this.press = 0; this.flow = 0; this.used = 0; this.refill = 0; this.acc = 0; this.t = 0; },
  started() { return this.cm > 0.5; },
  result() { return fmtLen(this.cm); },
  commit(tot) { add(tot, 'paste', this.cm); },
  down(id) { this.hold[id] = 1; },
  move() {},
  up(id) { if (id == null) this.hold = {}; else delete this.hold[id]; },
  update(dt) {
    this.t += dt;
    const n = Object.keys(this.hold).length;
    this.press = n ? Math.min(1, this.press + dt * 1.5) : Math.max(0, this.press - dt * 5);
    const target = n ? (30 + 90 * this.press) * (n > 1 ? 1.4 : 1) : 0; // cm/秒。長く押すほど勢いが増す。2本指だとさらに
    this.flow += (target - this.flow) * Math.min(1, dt * 12);
    if (!n && this.flow < 1) this.flow = 0;
    const d = this.flow * dt;
    this.cm += d; this.used += d; this.acc += d;
    if (this.acc > 8) { this.acc = 0; sfx.squish(); }
    if (this.used >= TUBE_CM) { this.used -= TUBE_CM; this.refill = 1; sfx.refill(); }
    this.refill = Math.max(0, this.refill - dt);
  },
  geo() { const s = SC(); return { s, cx: W / 2, ny: H * 0.42, top: H * 0.6, sinkY: H * 0.76, sinkW: Math.min(W * 0.84, 360 * s), rope: 15 * s }; },
  rope(path, w) { // 白に青の線が入った歯みがき粉
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    path(); ctx.lineWidth = w + 4; ctx.strokeStyle = INK; ctx.stroke();
    path(); ctx.lineWidth = w; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    path(); ctx.lineWidth = w * 0.32; ctx.strokeStyle = '#4fb3d9'; ctx.stroke();
  },
  tubePath(g, w, by, y1) {
    const s = g.s, mid = Math.max(by + 30 * s, y1 - 22 * s);
    ctx.beginPath();
    ctx.moveTo(g.cx - 44 * s, by); ctx.lineTo(g.cx + 44 * s, by);
    ctx.quadraticCurveTo(g.cx + w / 2, by + 24 * s, g.cx + w / 2, mid);
    ctx.quadraticCurveTo(g.cx + w / 2, y1, g.cx + 14 * s, y1);
    ctx.lineTo(g.cx - 14 * s, y1);
    ctx.quadraticCurveTo(g.cx - w / 2, y1, g.cx - w / 2, mid);
    ctx.quadraticCurveTo(g.cx - w / 2, by + 24 * s, g.cx - 44 * s, by);
    ctx.closePath();
  },
  draw() {
    const g = this.geo(), s = g.s;
    ctx.fillStyle = this.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.beginPath();
    const ts = 46 * s;
    for (let x = (W / 2) % ts; x < W; x += ts) { ctx.moveTo(x, 0); ctx.lineTo(x, g.top); }
    for (let y = 20; y < g.top; y += ts) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    // 洗面台
    ctx.fillStyle = '#eef3f6'; ctx.fillRect(0, g.top, W, H - g.top);
    ctx.fillStyle = INK; ctx.fillRect(0, g.top, W, 4);
    ctx.beginPath(); ctx.ellipse(g.cx, g.sinkY, g.sinkW / 2, g.sinkW * 0.17, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(g.cx, g.sinkY + 5 * s, g.sinkW * 0.41, g.sinkW * 0.12, 0, 0, Math.PI * 2); ctx.fillStyle = '#d6e3ea'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(g.cx, g.sinkY + 9 * s, 10 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fillStyle = '#7d8a94'; ctx.fill();
    // 山（ソフトクリームのように巻いて積もる）
    const per = 1.8 * s, R0 = g.sinkW * 0.2, step = g.rope * 0.8, base = g.sinkY + 6 * s;
    let left = this.cm * per, i = 0;
    const layers = [];
    while (left > 0 && i < 9) { const R = R0 * Math.max(0.3, 1 - i * 0.1), len = Math.PI * 2 * R * 0.7; layers.push([R, Math.min(1, left / len)]); left -= len; i++; }
    // 山に乗り切らない分は、洗面台のまわりに散らかる
    const nOver = Math.min(70, Math.ceil(Math.max(0, left) / per / 30));
    for (let j = 0; j < nOver; j++) {
      const x = W * (0.06 + 0.88 * sr(j * 3.1)), y = g.top + 18 * s + (H - g.top - 34 * s) * sr(j * 7.7 + 1), L = 24 * s;
      ctx.save(); ctx.translate(x, y); ctx.rotate((sr(j * 5.3) - 0.5) * 1.4);
      this.rope(() => { ctx.beginPath(); ctx.moveTo(-L, 0); ctx.quadraticCurveTo(-L / 2, 14 * s, 0, 0); ctx.quadraticCurveTo(L / 2, -14 * s, L, 0); }, g.rope * 0.85);
      ctx.restore();
    }
    layers.forEach(([R, f], k) => {
      const y = base - k * step;
      this.rope(() => { ctx.beginPath(); ctx.ellipse(g.cx, y, R, R * 0.34, 0, Math.PI * 0.5, Math.PI * 0.5 + Math.PI * 2 * f); }, g.rope);
    });
    const topY = base - Math.max(0, layers.length - 1) * step;
    if (this.flow > 1) {
      const w = g.rope * (0.6 + 0.4 * Math.min(1, this.flow / 90));
      this.rope(() => { ctx.beginPath(); ctx.moveTo(g.cx, g.ny); ctx.lineTo(g.cx, topY); }, w);
    }
    // チューブ（口が下）。押すとへこみ、使った分だけ上から平たくなる
    const rem = 1 - this.used / TUBE_CM;
    const sq = 1 - 0.2 * this.press * (1 + (calm ? 0 : 0.15 * Math.sin(this.t * 30)));
    const w = 80 * s * sq, y1 = g.ny - 30 * s, y0 = y1 - 150 * s, flat = (y1 - y0 - 44 * s) * (1 - rem), by = y0 + flat + 8 * s;
    rr(g.cx - 11 * s, y1 - 4, 22 * s, g.ny - y1 + 4, 4 * s); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    rr(g.cx - 46 * s, y0, 92 * s, flat + 16 * s, 4 * s); ctx.fillStyle = '#dfe8ee'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    this.tubePath(g, w, by, y1); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.save(); this.tubePath(g, w, by, y1); ctx.clip();
    ctx.fillStyle = '#2f8fd6'; ctx.fillRect(g.cx - 60 * s, y1 - 66 * s, 120 * s, 26 * s);
    ctx.fillStyle = PAPER; ctx.font = `${Math.round(14 * s)}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ハミガキ', g.cx, y1 - 52 * s);
    ctx.restore();
    this.tubePath(g, w, by, y1); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    if (this.refill > 0) bigText('おかわり！', g.cx, y0 - 26 * s, 30, POP, INK, W * 0.8);
  },
  drawHint(t) {
    const g = this.geo();
    tapHint(g.cx, g.ny - 30 * g.s - 75 * g.s, t, 1.2);
  }
};

/* ---------- ステージ5: シャンプー ---------- */
const PUMP_N = 200; // 1本をしぼり切るまでのプッシュ数
const shampoo = {
  key: 'shampoo', name: 'シャンプー', prompt: '押せ！', hint: 'ポンプを連打', bg: '#ffd6e4',
  bgm: song(146, [ // あわあわ
    ['bub', 0.09, '69 73 76 81 . 76 73 . 71 74 78 83 . 78 74 . 73 76 81 85 . 81 76 . 74 78 81 86 - - . .'],

  bill(t) { const n = t.shampoo || 0; return { v: n + 'プッシュ', n: 'ボトル ' + (n / PUMP_N).toFixed(1) + '本分・泡を流す', sec: n * 5, yen: n * 3 }; },
  init() { this.n = 0; this.press = 0; this.used = 0; this.refill = 0; this.globs = []; this.blobs = []; this.bubbles = []; this.t = 0; },

  result() { return this.n + 'プッシュ'; },
  commit(tot) { add(tot, 'shampoo', this.n); },
  geo() {

  },
  down() { this.push(); },
  move() {},
  up() {},

    const k = rnd(0.6, 1.2);

  update(dt) {

    const s = SC();
    for (let i = this.globs.length - 1; i >= 0; i--) {
      const b = this.globs[i];
      b.vy += 1400 * s * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x > W - 14) { b.x = W - 14; b.vx = -Math.abs(b.vx) * 0.3; }

        this.globs.splice(i, 1);
      }
    }
    for (let i = this.bubbles.length - 1; i >= 0; i--) {
      const b = this.bubbles[i];
      b.y += b.vy * dt; b.x += Math.sin(this.t * 3 + b.ph) * 20 * s * dt; b.life -= dt;
      if (b.life <= 0) this.bubbles.splice(i, 1);

    for (let y = 26; y < g.floor; y += ts) { ctx.moveTo(0, y); ctx.lineTo(W, y); }

      ctx.fillStyle = 'rgba(214,120,235,.85)'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(35,27,46,.25)'; ctx.stroke();

    rr(bl, g.by, g.bw, g.bh, 18 * s); ctx.fillStyle = '#f4ecff'; ctx.fill();
    ctx.save(); rr(bl, g.by, g.bw, g.bh, 18 * s); ctx.clip();

    rr(g.bx - g.bw * 0.36, g.by + g.bh * 0.32, g.bw * 0.72, g.bh * 0.32, 8 * s); ctx.fillStyle = PAPER; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = INK; ctx.textBaseline = 'middle';
    fitText('シャンプー', g.bx, g.by + g.bh * 0.48, g.bw * 0.62, `${Math.round(15 * s)}px ${DISPLAY}`, 'center');
    // ポンプ
    rr(g.bx - 18 * s, g.by - 16 * s, 36 * s, 20 * s, 5 * s); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    rr(g.bx - 6 * s, g.hy + 12 * s, 12 * s, g.by - 16 * s - (g.hy + 12 * s), 3 * s); ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    rr(g.bx + 26 * s, g.hy + 3 * s, 42 * s, 10 * s, 4 * s); ctx.fill(); ctx.stroke();
    rr(g.bx - 26 * s, g.hy, 60 * s, 18 * s, 7 * s); ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    // 飛んでいるシャンプー
    for (const b of this.globs) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = '#d678eb'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();

  up(id) { if (id == null) this.ptr = {}; else delete this.ptr[id]; },

  draw() {

    ctx.fillStyle = 'rgba(255,255,255,.8)';

const EC = 3, ER = 8; // ボタンの列と段
const elev = {
  key: 'elev', name: 'エレベーター', prompt: '全部押せ！', hint: 'ボタンを かたっぱしからタップ', bg: '#c9ced6',
  bgm: song(108, [ // エレベーターの中に流れていそうな音楽
    ['ep', 0.09, '76 . . 74 . . 72 . 71 - - . 69 . . . 74 . . 72 . . 71 . 69 - - . 67 - - .'],
    ['triangle', 0.12, '48 . . 55 48 . . 55 50 . . 57 50 . . 57 43 . . 50 43 . . 50 48 . . 55 48 . . 55']
  ], ['r..r..r...r..r..r..r..r...r..r..', 'h.h.h.h.h.h.h.h.h.h.h.h.h.h.h.h.'], { every: 8, v: 'ep', vol: 0.03, chords: [[64, 67, 71], [62, 65, 69], [59, 62, 65], [64, 67, 71]] }),
  shop: null,
  bill(t) { const n = t.elev || 0; return { v: n + '階分', n: '全部の階に止まる（乗り合わせた人も巻きぞえ）', sec: n * 15, yen: 0 }; },
  init() { this.n = 0; this.lit = new Array(EC * ER).fill(0); this.old = null; this.slide = 0; this.wait = 0; this.t = 0; },
  started() { return this.n > 0; },
  result() { return this.n + '階分'; },
  commit(tot) { add(tot, 'elev', this.n); },
  geo() {
    const s = SC(), pw = Math.min(W * 0.72, 270 * s), ph = Math.min(H * 0.78, pw * 2.4);
    const x = (W - pw) / 2, y = H * 0.13 + (H * 0.83 - ph) / 2, top = y + ph * 0.15, cw = pw / EC, ch = ph * 0.72 / ER;
    return { s, x, y, pw, ph, top, cw, ch, r: Math.min(cw, ch) * 0.36 };
  },
  floor(i) { return (ER - 1 - Math.floor(i / EC)) * EC + i % EC + 1; },
  center(i, g) { return [g.x + (i % EC + 0.5) * g.cw, g.top + (Math.floor(i / EC) + 0.5) * g.ch]; },
  buttons() { const g = this.geo(); return this.lit.map((_, i) => this.center(i, g)); },
  down(id, x, y) {
    if (this.slide > 0 || this.wait > 0) return;
    const g = this.geo();

  up() {},

  },

    const g = this.geo(), s = g.s;
    ctx.save(); ctx.translate(ox, 0);
    rr(g.x, g.y, g.pw, g.ph, 10 * s); ctx.fillStyle = '#e4e8ec'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = g.x + 8; x < g.x + g.pw - 6; x += 6) { ctx.moveTo(x, g.y + 6); ctx.lineTo(x, g.y + g.ph - 6); }

      ctx.beginPath(); ctx.arc(cx, cy, g.r, 0, Math.PI * 2); ctx.fillStyle = v ? '#ffb84d' : '#f7f8fa'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, g.r * 0.78, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = v ? 'rgba(255,255,255,.7)' : 'rgba(35,27,46,.15)'; ctx.stroke();
      ctx.fillStyle = INK; ctx.font = `${Math.round(g.r * 0.85)}px ${DISPLAY}`; ctx.fillText(String(this.floor(i)), cx, cy + 1);
    });
    const by = g.y + g.ph * 0.93;

      const cx = g.x + g.pw / 2 + sx * g.pw * 0.18, a = g.r * 0.32;

      ctx.fillStyle = INK; ctx.fillRect(cx - 1, by - a, 2, a * 2);

    });
    ctx.restore();
  },
  draw() {
    ctx.fillStyle = this.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; for (let x = 0; x < W; x += 60) ctx.fillRect(x, 0, 28, H);

  },
  drawHint(t) { const g = this.geo(), c = this.center(9 + Math.floor(t * 2.5) % 3, g); tapHint(c[0], c[1], t, 2.5); }
};

    if (!recVideo) recVideo = cv.captureStream(30);
    if (!recAV && recDest) recAV = new MediaStream(recVideo.getVideoTracks().concat(recDest.stream.getAudioTracks()));
  } catch (e) { recErr = String(e && e.message || e); }
  // 音つきで始められなければ、映像だけで録る
  for (const c of [recAV, recVideo]) {
    if (!c || r) continue;
    try { r = new MediaRecorder(c, opt); r.start(1000); } catch (e) { recErr = String(e && e.message || e); r = null; }
  }
  if (!r) return;
  const fin = () => {
    if (done || tok !== recTok) return; done = true;
    if (!chunks.length) { $('recHint').textContent = 'この端末では録画データを作れませんでした。' + (recErr ? '（' + recErr + '）' : ''); return; }
    recBlob = new Blob(chunks, { type: (r.mimeType || mime || 'video/webm').split(';')[0] });
    $('saveVid').hidden = false; $('recHint').textContent = '動画の準備ができました。';
  };
  r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  r.onstop = fin; r.onerror = e => { recErr = String(e && e.error && e.error.message || '録画エラー'); };
  recFinish = fin; rec = r;
}
function recStop() {
  const r = rec, fin = recFinish; rec = null; if (!r) return;
  if (r.state !== 'inactive') { try { r.stop(); } catch (e) {} }
  if (fin) setTimeout(fin, 2000); // 停止の通知が来ない端末向けの保険
}
function recCancel() { recTok++; recBlob = null; recStop(); }
function recPause(v) {
  if (!rec) return;
  try { if (v && rec.state === 'recording') rec.pause(); else if (!v && rec.state === 'paused') rec.resume(); } catch (e) {}
}

/* ---------- シェア・買い直し ---------- */
const AMAZON_TAG = '202610jokesite-22';
function shareText() {
  return 'いたずラッシュで遊んだ結果\n損害額 ' + res.yen.toLocaleString('ja-JP') + '円／後始末 ' + fmtTime(res.sec) +
    '\n怒られ度 ' + res.angry + '%【' + res.word + '】\n#いたずラッシュ';
}
function saveBlob(blob, name, text) {
  let file = null;
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  try { file = new File([blob], name, { type: blob.type }); } catch (e) {}
  if (coarse && file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], text }).catch(() => {}); return; }
  const a = document.createElement('a'), u = URL.createObjectURL(blob);
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function fillShop() {
  const ul = $('shopList'); ul.textContent = '';
  const items = [];
  for (const s of BONUS ? NORMAL.concat(BONUS) : NORMAL) if (played.has(s.key) && s.shop) items.push(...s.shop);
  items.forEach(([label, q]) => {
    const li = document.createElement('li'), a = document.createElement('a'), sm = document.createElement('small');
    a.href = 'https://www.amazon.co.jp/s?k=' + encodeURIComponent(q) + '&tag=' + AMAZON_TAG;
    a.target = '_blank'; a.rel = 'sponsored noopener'; a.textContent = label; sm.textContent = 'Amazonで探す →';
    a.appendChild(sm); li.appendChild(a); ul.appendChild(li);
  });
  $('shopBtn').hidden = !items.length;
}

/* ---------- 入力 ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const live = () => mode === 'play' && !paused && st;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (!live()) return; const p = pos(e); st.down(e.pointerId, p[0], p[1]);
});
cv.addEventListener('pointermove', e => { if (!live()) return; const p = pos(e); st.move(e.pointerId, p[0], p[1]); });
const end = e => { if (st) st.up(e.pointerId); };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
cv.addEventListener('contextmenu', e => e.preventDefault());

$('startBtn').addEventListener('click', () => startGame('loop'));
$('endlessBtn').addEventListener('click', () => startGame('endless'));
$('againBtn').addEventListener('click', () => startGame());
$('pauseBtn').addEventListener('click', () => setPause(true));
$('resumeBtn').addEventListener('click', () => { initAudio(); setPause(false); });
$('quitBtn').addEventListener('click', finish);
$('homeBtn').addEventListener('click', goTitle);
$('home2Btn').addEventListener('click', goTitle);
$('shopBtn').addEventListener('click', () => { panels.shop.hidden = false; });
$('shopClose').addEventListener('click', () => { panels.shop.hidden = true; });
$('xpost').addEventListener('click', () => {
  if (!res) return;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText()) + '&url=' + encodeURIComponent(SITE), '_blank', 'noopener');
});
$('saveVid').addEventListener('click', () => {
  if (!recBlob || !res) return;
  saveBlob(recBlob, 'itazu-rush-' + res.yen + 'yen.' + (recBlob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm'), shareText() + '\n' + SITE);
  $('recHint').textContent = '動画を書き出しました。';
});
function setSound(v) {
  soundOn = v; $('soundChk').checked = v; $('soundChk2').checked = v;
  if (spk) spk.gain.value = v ? 1 : 0;
  try { localStorage.setItem('itazurush-sound', v ? '1' : '0'); } catch (e) {}
}
$('soundChk').addEventListener('change', e => setSound(e.target.checked));
$('soundChk2').addEventListener('change', e => setSound(e.target.checked));
$('recChk').addEventListener('change', e => {
  recOn = e.target.checked; if (recOn) initAudio(); // 録画前に音の準備を済ませておく
  try { localStorage.setItem('itazurush-rec', recOn ? '1' : '0'); } catch (err) {}
});
setSound(soundOn);
if (canRec) { $('recOpt').hidden = false; $('recNote').hidden = false; $('recChk').checked = recOn; }
$('chips').innerHTML = NORMAL.map(s => '<li>' + s.name + '</li>').join('') + (BONUS ? '<li class="secret">？？？</li>' : '');
$('startSub').textContent = '全' + N + '種を' + ROUNDS + '周';
window.addEventListener('resize', () => { if (mode === 'result') measureBar(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
if (document.fonts && document.fonts.load) {
  const txt = NORMAL.concat(BONUS || []).map(s => s.prompt + s.name + (s.done || '')).join('') +
    'いたずら成功！おかわりボーナスレア出現本目判定：後始末にかかる時間損害額怒られ度円秒分時間%/0123456789.' + 'まだバレてない正座10分おやつ抜き家族会議おこづかい3か月停止伝説のいたずらっ子';
  document.fonts.load(`40px ${DISPLAY}`, txt).catch(() => {});
}
// 自動テスト用（URLの末尾が #test のときだけ）
if (location.hash === '#test') {
  window.__itazu = { get mode() { return mode; }, get st() { return st; }, get count() { return count; }, get res() { return res; }, get tot() { return tot; },
    get rec() { return rec; }, get recBlob() { return recBlob; }, NORMAL, BONUS, music, force(keys) { forced = keys.slice(); }, finish, setPause };
}
})();
