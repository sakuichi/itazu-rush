<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いたずラッシュ</title>
<meta name="description" content="子どものころにやりたかったいたずらを、数秒ずつやり放題。最後に大人の現実（後始末の時間・損害額・怒られ度）を突きつけられるストレス解消ネタサイト。">
<meta property="og:type" content="website">
<meta property="og:title" content="いたずラッシュ">
<meta property="og:description" content="子どものころにやりたかったいたずらを、数秒ずつやり放題。最後に大人の現実が待っています。">
<meta property="og:url" content="https://sakuichi.github.io/itazu-rush/">
<link rel="canonical" href="https://sakuichi.github.io/itazu-rush/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: 縦長1画面のゲーム台。キャンバス全面（HUDと結果もキャンバスに描く＝録画に写る）、操作用のボタンだけDOM */
:root{
  --ink:#231b2e; --paper:#fffdf5; --pop:#ffd23f; --pop-deep:#ffb81f;
  --hot:#ff5a4e; --mint:#2fb5a3; --mute:#6b6178;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:560px;margin-inline:auto;background:var(--pop);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:absolute;top:10px;right:16px;pointer-events:none}
#pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}

.panel{position:absolute;inset:0;display:flex;padding:16px 20px 24px 16px;overflow:auto}
#pause,#shop{background:rgba(35,27,46,.62)}
.card{margin:auto;width:100%;max-width:400px;background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.08em;background:var(--ink);color:var(--pop);padding:3px 9px;border-radius:3px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,48px);line-height:1.05;margin:0;text-wrap:balance;transform:rotate(-2deg);transform-origin:left center}
h1 span{color:var(--hot)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.25}
p{margin:0;line-height:1.7;font-size:15px}
.lead{font-weight:700}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:13px;font-weight:700;line-height:1.5;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:#fff}
.chips li.secret{background:var(--ink);color:var(--pop)}
.btns{display:flex;flex-direction:column;gap:10px}
button.big{font-family:var(--display);font-size:20px;line-height:1.3;padding:12px 16px;border:4px solid var(--ink);border-radius:6px;background:var(--hot);color:var(--paper);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
button.big.sub{background:var(--paper);color:var(--ink);font-size:16px;padding:10px 16px}
button.big small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
button.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--hot)}
.small{font-size:12px;color:var(--mute);line-height:1.6}
.small:empty{display:none}

/* 結果：中身はキャンバスに描き、下にボタンの帯だけ出す */
.panel.bottom{align-items:flex-end;pointer-events:none;padding:12px 16px 14px}
.resbar{pointer-events:auto;width:100%;max-width:420px;margin:0 auto;background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.resbar button.big{font-size:18px;padding:10px 12px}
.minirow{display:flex;gap:6px}
button.mini{flex:1 1 0;min-width:0;font-family:var(--body);font-weight:900;font-size:13px;line-height:1.3;padding:8px 2px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
button.mini:active{transform:translate(2px,2px)}
.shoplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.shoplist a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.shoplist small{color:var(--mute);font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="ゲーム画面"></canvas>

  <div id="hud" hidden>
    <button id="pauseBtn" type="button" aria-label="中断する">II</button>
  </div>

  <section class="panel" id="title">
    <div class="card">
      <div class="tag">試作版</div>
      <h1>いたず<br><span>ラッシュ</span></h1>
      <p class="lead">子どものころ、やりたかったやつ。<br>後片付けのことは考えなくていい。</p>
      <ul class="chips" id="chips" aria-label="出てくるいたずら"></ul>
      <div class="btns">
        <button class="big" id="startBtn" type="button">はじめる<small id="startSub"></small></button>
        <button class="big sub" id="endlessBtn" type="button">無限モード<small>「やめて結果を見る」まで続く</small></button>
      </div>
      <div class="opts">
        <label class="opt" for="soundChk"><input type="checkbox" id="soundChk" checked>音を出す</label>
        <label class="opt" for="recChk" id="recOpt" hidden><input type="checkbox" id="recChk">録画する</label>
      </div>
      <p class="small" id="recNote" hidden>録画すると、プレイから結果までを音つきの動画で保存できます（音を出さない設定でも、動画には音が入ります）。</p>
      <p class="small">周回ごとに速くなります。失敗はありません。右上の II でいつでも中断できます。</p>
      <p class="small">※いたずらをすすめるものではありません。画面の中だけで楽しんでください。</p>
    </div>
  </section>

  <section class="panel" id="pause" hidden>
    <div class="card">
      <h2>中断中</h2>
      <div class="btns">
        <button class="big" id="resumeBtn" type="button">つづける</button>
        <button class="big sub" id="quitBtn" type="button">ここでやめて結果を見る</button>
        <button class="big sub" id="homeBtn" type="button">タイトルにもどる</button>
      </div>
      <label class="opt" for="soundChk2"><input type="checkbox" id="soundChk2" checked>音を出す</label>
    </div>
  </section>

  <section class="panel bottom" id="result" hidden>
    <div class="resbar" id="resbar">
      <button class="big" id="againBtn" type="button">もう一回いたずらする</button>
      <div class="minirow">
        <button class="mini" id="saveVid" type="button" hidden>動画を保存</button>
        <button class="mini" id="xpost" type="button">Xでポスト</button>
        <button class="mini" id="shopBtn" type="button">買い直す</button>
        <button class="mini" id="home2Btn" type="button">タイトル</button>
      </div>
      <p class="small" id="recHint" role="status"></p>
    </div>
  </section>

  <section class="panel" id="shop" hidden>
    <div class="card">
      <div class="tag">PR</div>
      <h2>いたずらした分を<br>買い直す</h2>
      <ul class="shoplist" id="shopList"></ul>
      <p class="small">Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。</p>
      <button class="big sub" id="shopClose" type="button">とじる</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const INK = '#231b2e', PAPER = '#fffdf5', POP = '#ffd23f', POP2 = '#ffb81f', HOT = '#ff5a4e';
const DISPLAY = '"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
const BODY = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const sr = s => { const x = Math.sin(s * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function bigText(str, x, y, size, fill, stroke, maxW) {
  ctx.save();
  ctx.font = `${size}px ${DISPLAY}`;
  if (maxW) {
    const m = ctx.measureText(str).width;
    if (m > maxW) { size = size * maxW / m; ctx.font = `${size}px ${DISPLAY}`; }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
  ctx.restore();
}
function finger(x, y, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI * 2);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

/* ---------- 音 ---------- */
/* 経路: 効果音・BGM → bus →（スピーカー用ゲイン → スピーカー）と（録画用の出力）。
   音を出さない設定はスピーカー用ゲインを0にするだけで、音そのものは作り続ける（録画には入る） */
let AC = null, noiseBuf = null, bus = null, spk = null, bgmBus = null, recDest = null, soundOn = true;
try { soundOn = localStorage.getItem('itazurush-sound') !== '0'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume(); return; } // iOSは共有シートなどの後に "interrupted" になる
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.5), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    bus = AC.createGain(); bus.gain.value = 0.8;
    spk = AC.createGain(); spk.gain.value = soundOn ? 1 : 0;
    bus.connect(spk); spk.connect(AC.destination);
    bgmBus = AC.createGain(); bgmBus.gain.value = 0.55; bgmBus.connect(bus);
    try {
      recDest = AC.createMediaStreamDestination(); bus.connect(recDest);
      // 録画用の音声を途切れさせないための、聞こえない音（スピーカーには流さない）。無音区間で音声データが抜けると動画の音がズレる
      const ka = AC.createOscillator(), kg = AC.createGain();
      ka.frequency.value = 20; kg.gain.value = 0.0005; ka.connect(kg); kg.connect(recDest); ka.start();
    } catch (e) { recDest = null; }
  } catch (e) { AC = null; }
}
function noise(dur, freq, q, vol, type, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, vol, type, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  tissue() { noise(0.13, rnd(2600, 3800), 0.7, 0.28); },
  tick() { noise(0.035, rnd(1500, 2100), 3, 0.16); },
  shoji() { noise(0.1, rnd(380, 620), 0.8, 0.5, 'lowpass'); tone(150, 60, 0.09, 0.2, 'sine'); },
  slide() { noise(0.25, 900, 0.6, 0.25); tone(90, 70, 0.2, 0.15, 'triangle'); },
  refill() { tone(660, 990, 0.12, 0.1); },
  prompt() { tone(660, 660, 0.08, 0.1); tone(880, 880, 0.12, 0.1, 'square', 0.09); },
  flash() { tone(523, 523, 0.09, 0.1); tone(784, 784, 0.16, 0.1, 'square', 0.09); },
  final() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 0.1, 'square', i * 0.11)); },
  rare() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, f, 0.1, 0.08, 'square', i * 0.06)); noise(0.4, 6000, 1, 0.08, 'highpass', 0.3); },
  row() { tone(1200, 1200, 0.04, 0.05, 'square'); },
  stamp() { tone(170, 55, 0.22, 0.4, 'sine'); noise(0.14, 500, 0.7, 0.45, 'lowpass'); }
};

/* ---------- BGM（その場で合成する、ステージごとの2小節ループ） ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// 音符列: 16分音符1つにつき1語。数字=MIDIノート番号、'-'=前の音をのばす、'.'=休み
function seq(str) {
  const tk = str.trim().split(/\s+/), out = new Array(tk.length).fill(null);
  let last = -1;
  tk.forEach((s, i) => {
    if (s === '-') { if (last >= 0) out[last][1]++; }
    else if (s === '.') last = -1;
    else { out[i] = [+s, 1]; last = i; }
  });
  return out;
}
function song(bpm, tracks, drums, pad) {
  const t = tracks.map(([v, vol, str]) => ({ v, vol, seq: seq(str) }));
  return { bpm, tracks: t, drums, pad, len: t[0].seq.length };
}
function voice(kind, m, t, dur, vol, out) {
  const f = mtof(m);
  const osc = (type, freq, mul, d, a) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * mul, t + (a || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.03);
    return o;
  };
  switch (kind) {
    case 'pluck': osc('triangle', f, 1, Math.max(0.28, dur)); osc('sine', f * 2, 0.45, 0.12); break; // 琴っぽい
    case 'bell': osc('sine', f, 1, 0.7, 0.003); osc('sine', f * 2.76, 0.35, 0.3, 0.003); break;
    case 'ep': osc('sine', f, 1, Math.max(0.45, dur * 1.1), 0.012); osc('triangle', f * 2, 0.16, 0.25, 0.012); break;
    case 'bub': { const o = osc('sine', f, 1, Math.min(0.16, dur)); o.frequency.setValueAtTime(f * 0.6, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05); break; }
    case 'wob': { const o = osc('sine', f, 1, dur * 0.95); o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.07); osc('triangle', f, 0.4, dur * 0.9); break; }
    default: osc(kind, f, 1, dur * 0.92);
  }
}
function drum(c, t, out) {
  const n = (dur, freq, q, vol, type) => {
    const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; fl.type = type || 'bandpass'; fl.frequency.value = freq; fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
  };
  const k = (f0, f1, dur, vol) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  };
  switch (c) {
    case 'k': k(150, 45, 0.12, 0.5); break;                              // キック
    case 's': n(0.12, 1800, 0.8, 0.22); k(220, 160, 0.06, 0.12); break; // スネア
    case 'h': n(0.035, 8000, 1, 0.08, 'highpass'); break;               // ハイハット
    case 'o': n(0.16, 7000, 1, 0.07, 'highpass'); break;                // オープンハイハット
    case 'c': n(0.08, 1400, 1.2, 0.25); break;                          // クラップ
    case 't': k(180, 70, 0.22, 0.5); n(0.08, 500, 1, 0.12, 'lowpass'); break; // 太鼓
    case 'r': n(0.03, 2500, 4, 0.25); break;                            // リムショット
    case 'j': n(0.05, 9500, 2, 0.06, 'highpass'); n(0.04, 7000, 3, 0.04); break; // 鈴
  }
}
const music = {
  song: null, out: null, step: 0, next: 0, dur: 0.1, timer: 0,
  start(sg, rate) {
    this.stop();
    if (!AC || !sg) return;
    this.song = sg; this.dur = 60 / (sg.bpm * rate) / 4; this.step = 0; this.next = AC.currentTime + 0.05;
    this.out = AC.createGain(); this.out.gain.value = 1; this.out.connect(bgmBus);
    this.timer = setInterval(() => this.pump(), 25); this.pump();
  },
  stop() {
    clearInterval(this.timer); this.timer = 0; this.song = null;
    if (this.out && AC) {
      const o = this.out; o.gain.setTargetAtTime(0, AC.currentTime, 0.03);
      setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 500);
    }
    this.out = null;
  },
  pump() {
    const s = this.song; if (!s || !AC) return;
    if (this.next < AC.currentTime - 0.2) this.next = AC.currentTime + 0.02; // タブの裏などで遅れたら追いつかせない
    while (this.next < AC.currentTime + 0.12) {
      const i = this.step % s.len, t = this.next, d = this.dur;
      for (const tr of s.tracks) { const ev = tr.seq[i]; if (ev) voice(tr.v, ev[0], t, ev[1] * d, tr.vol, this.out); }
      if (s.pad && i % s.pad.every === 0) {
        for (const m of s.pad.chords[(i / s.pad.every) % s.pad.chords.length]) voice(s.pad.v, m, t, s.pad.every * d, s.pad.vol, this.out);
      }
      for (const dl of s.drums) { const c = dl[i % dl.length]; if (c !== '.') drum(c, t, this.out); }
      this.step++; this.next += d;
    }
  }
};

/* ---------- ステージ1: ティッシュ ---------- */
const tissue = {
  key: 'tissue', name: 'ティッシュ', prompt: '出せ！', hint: '左右に交互にスワイプ', bg: '#ff9e8a',
  bgm: song(152, [ // 軽快
    ['square', 0.05, '72 . 76 . 79 . 76 . 72 . 74 . 76 - - . 77 . 76 . 74 . 72 . 74 . 71 . 72 - - .'],
    ['triangle', 0.16, '48 . . . 55 . . . 48 . . . 55 . . . 53 . . . 55 . . . 48 . . . 43 . 47 .']
  ], ['k.h.s.h.k.h.s.hhk.h.s.h.k.h.s.hh']),

  soundOn = v; $('soundChk').checked = v; $('soundChk2').checked = v;
  if (spk) spk.gain.value = v ? 1 : 0;
  try { localStorage.setItem('itazurush-sound', v ? '1' : '0'); } catch (e) {}
}
$('soundChk').addEventListener('change', e => setSound(e.target.checked));
$('soundChk2').addEventListener('change', e => setSound(e.target.checked));
$('recChk').addEventListener('change', e => {
  recOn = e.target.checked; if (recOn) initAudio(); // 録画前に音の準備を済ませておく
  try { localStorage.setItem('itazurush-rec', recOn ? '1' : '0'); } catch (err) {}
});
setSound(soundOn);
if (canRec) { $('recOpt').hidden = false; $('recNote').hidden = false; $('recChk').checked = recOn; }
$('chips').innerHTML = NORMAL.map(s => '<li>' + s.name + '</li>').join('') + (BONUS ? '<li class="secret">？？？</li>' : '');
$('startSub').textContent = '全' + N + '種を' + ROUNDS + '周';
window.addEventListener('resize', () => { if (mode === 'result') barH = $('resbar').offsetHeight + 26; });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
if (document.fonts && document.fonts.load) {
  const txt = NORMAL.concat(BONUS || []).map(s => s.prompt + s.name + (s.done || '')).join('') +
    'いたずら成功！おかわりボーナスレア出現本目判定：後始末にかかる時間損害額怒られ度円秒分時間%/0123456789.' + 'まだバレてない正座10分おやつ抜き家族会議おこづかい3か月停止伝説のいたずらっ子';
  document.fonts.load(`40px ${DISPLAY}`, txt).catch(() => {});
}
// 自動テスト用（URLの末尾が #test のときだけ）
if (location.hash === '#test') {
  window.__itazu = { get mode() { return mode; }, get st() { return st; }, get count() { return count; }, get res() { return res; }, get tot() { return tot; },
    get rec() { return rec; }, get recBlob() { return recBlob; }, NORMAL, BONUS, music, force(keys) { forced = keys.slice(); }, finish, setPause };
}
})();
